<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste do Método de Sono</title>
<meta name="description" content="Sete perguntas rápidas para descobrir qual método de sono combina com o seu filho. Protocolo Sono sem Drama, por Lourdes Corsi.">
<meta name="theme-color" content="#3D1D49">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFF6E0; --surface:#FFFFFF; --ink:#2f2238; --muted:#6b5a78; --line:#cfc7ff; --soft:#E4DFFF;
  --accent:#633484; --accent-ink:#FFFFFF; --glow:#FFD233; --glow-soft:#FFF1C4; --lav:#B9AEFF; --lar:#F27F4A;
  --stop:#E5544B; --go:#4FAF6B; --shadow:#E4DFFF; --help:#FFF1C4;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1433; --surface:#3D1D49; --ink:#F3ECFA; --muted:#BFAED0; --line:#5a3a6d; --soft:#4a2a5c;
  --accent:#B9AEFF; --accent-ink:#2a1433; --glow:#FFD233; --glow-soft:#4d3d22; --shadow:#2a1433; --help:#4a2a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1433; --surface:#3D1D49; --ink:#F3ECFA; --muted:#BFAED0; --line:#5a3a6d; --soft:#4a2a5c;
  --accent:#B9AEFF; --accent-ink:#2a1433; --glow:#FFD233; --glow-soft:#4d3d22; --shadow:#2a1433; --help:#4a2a5c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--body);padding-inline:16px;padding-block:22px 64px;
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(64px,env(safe-area-inset-bottom,0px));overflow-x:hidden}
.deco{position:fixed;pointer-events:none;z-index:0;opacity:.9}
.deco svg{display:block;width:100%;height:auto}
.deco.a{left:-30px;top:58%;width:90px;opacity:.55}.deco.b{right:-30px;top:30%;width:130px;opacity:.55}
.deco.c{left:-24px;bottom:12%;width:100px;opacity:.5}.deco.d{right:10px;bottom:-26px;width:120px}
.wrap{position:relative;z-index:1;max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;gap:16px;align-items:center}
header .lua{flex:none;width:84px;animation:flutua 5s ease-in-out infinite}
header .lua svg{display:block;width:100%;height:auto}
@keyframes flutua{50%{transform:translateY(-6px) rotate(-3deg)}}
header .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font:600 11.5px/1.35 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(27px,7vw,38px)/1.08 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);font-size:16px;max-width:60ch;background:none}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.moons{display:flex;gap:7px;flex-wrap:wrap}
.moon{width:22px;height:22px;background:var(--line);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:transform .2s,background .2s}
.moon.done{background:var(--glow)}
.moon.now{background:var(--accent);transform:scale(1.28)}
.count{font:600 14px var(--display);letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:3px solid var(--line);border-radius:30px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 0 var(--shadow)}
h2{font:700 24px/1.22 var(--display);margin:0;text-wrap:balance}
h3{font:600 20px/1.2 var(--display);margin:0;color:var(--accent)}
.hint{margin:0;color:var(--muted);font-size:15px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:var(--ink);text-align:left;cursor:pointer;background:var(--bg);border:2.5px solid var(--line);border-radius:20px;
  padding:14px 16px;display:flex;gap:13px;align-items:flex-start;min-width:0;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--lav)}
.opt:active{transform:scale(.99)}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--lar);outline-offset:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.dot{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:2.5px solid var(--lav);background:var(--surface)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--soft)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.link{font:600 15px var(--body);color:var(--muted);background:none;border:0;padding:8px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn{font:600 17px var(--display);cursor:pointer;border-radius:999px;padding:14px 24px;border:2.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  box-shadow:0 5px 0 rgba(61,29,73,.35);text-decoration:none;display:inline-block;text-align:center;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(61,29,73,.35)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn.wa{background:#25a566;border-color:#25a566;color:#fff;align-self:flex-start}
.badge{align-self:flex-start;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#FFF6E0;background:#3D1D49;border-radius:999px;padding:7px 15px}
.result-name{font:700 clamp(28px,7vw,36px)/1.08 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.card p{margin:0}
.art{margin:2px 0;border-radius:34px;overflow:hidden;align-self:center;width:min(100%,340px)}
.art.small{width:min(100%,220px);align-self:flex-start}
.art img{display:block;width:100%;height:auto}
.moonart{width:120px;align-self:center}
.moonart svg{display:block;width:100%;height:auto}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:n;position:relative;padding-left:48px;min-height:34px}
.steps li::before{content:counter(n);position:absolute;left:0;top:-1px;width:34px;height:34px;border-radius:50%;background:var(--glow);color:#3D1D49;
  font:700 18px/34px var(--display);text-align:center}
.block{display:flex;flex-direction:column;gap:11px;padding-top:18px;border-top:2.5px dotted var(--line)}
.tally{display:flex;flex-direction:column;gap:9px}
.tally-row{display:grid;grid-template-columns:minmax(0,11em) 1fr auto;gap:10px;align-items:center;font-size:15px}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.tally-row b{font-variant-numeric:tabular-nums;font-family:var(--display)}
.clock{display:flex;gap:14px;align-items:flex-start}
.lights{flex:none;display:flex;flex-direction:column;gap:7px;padding:8px;border:2.5px solid var(--line);border-radius:999px;margin-top:2px;background:var(--bg)}
.lights span{width:16px;height:16px;border-radius:50%}
.lights .r{background:var(--stop)}.lights .g{background:var(--go)}
.small{font-size:14.5px;color:var(--muted)}
.copied{font-size:14px;color:var(--muted);min-height:1.4em}
.help{background:var(--help);border-radius:24px;padding:20px;border-top:0}
.help h3{color:var(--ink)}
textarea.fallback{width:100%;min-height:140px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px}
@media (max-width:420px){.card{padding:18px}.tally-row{grid-template-columns:minmax(0,8.5em) 1fr auto}header .lua{width:68px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .3s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(8px)}}}
</style></head>

  if (q1) letters.unshift(q1);
  var n = { A: 0, B: 0, C: 0 };
  letters.forEach(function (l) { n[l]++; });
  var order = ["A", "B", "C"].sort(function (x, y) { return n[y] - n[x]; });
  var top = order[0], second = order[1];
  var main, extra = null;
  var total = letters.length;
  if (total === 4 && (n[top] >= 3 || n[second] === 1)) {
    main = top;
  } else if (n[top] >= 4 || (n[top] === 3 && n[second] === 1)) {
    main = top;
  } else if (n[top] === 3) {
    main = top; extra = second;
  } else {
    // 2, 2, 1: combina as duas letras empatadas; a principal é a da pergunta 1
    var tied = [top, second];
    main = tied.indexOf(q1) >= 0 ? q1 : (tied.indexOf(a.q2) >= 0 ? a.q2 : top);
    extra = tied[0] === main ? tied[1] : tied[0];
  }
  // regra da idade: o "Com licença" depende de a criança conseguir esperar
  var swap = null, note = null;
  if (a.idade === "2") {
    swap = "A";
    note = "Suas respostas apontaram para o “Com licença, já volto”, mas esse método depende de a criança entender o combinado e esperar na cama, o que costuma vir a partir dos 3 anos. Por isso a indicação passou para a cadeira.";
  } else if (a.idade === "3a5" && a.q3 !== "B") {
    swap = a.q3;
    note = "Suas respostas apontaram para o “Com licença, já volto”, mas na pergunta sobre esperar você contou que ele ainda não consegue ficar tranquilo aguardando a sua volta. Por isso a indicação começa por outro caminho, e o “Com licença” pode entrar mais adiante.";
  }
  var adjusted = false;
  if (swap) {
    if (main === "B") { main = swap; adjusted = true; }
    if (extra === "B") { extra = swap; adjusted = true; }
    if (extra === main) extra = null;
  }
  var clock = a.noite !== "nenhum";
  return { counts: n, main: main, extra: extra, note: adjusted ? note : null,
           parentsBed: a.q1 === "pais", total: total,
           clock: clock, clockYoung: clock && a.idade === "2", older: a.idade === "6mais" };
}

/* ---------- interface ---------- */
var state = { step: 0, answers: {} };
var stage = document.getElementById("stage");
var moons = document.getElementById("moons");
var count = document.getElementById("count");
var progress = document.getElementById("progress");

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function drawProgress() {
  moons.innerHTML = "";
  QUESTIONS.forEach(function (q, i) {
    var m = el("span", "moon" + (i < state.step ? " done" : i === state.step ? " now" : ""));
    moons.appendChild(m);
  });
  count.textContent = "Pergunta " + (state.step + 1) + " de " + QUESTIONS.length;
}

function renderQuestion() {
  progress.hidden = false;
  drawProgress();
  var q = QUESTIONS[state.step];
  stage.innerHTML = "";
  var card = el("section", "card");
  card.appendChild(el("h2", null, q.text));
  var opts = el("div", "options");
  q.options.forEach(function (o, i) {
    var b = el("button", "opt");
    b.type = "button";
    b.id = "opt-" + q.id + "-" + i;
    b.setAttribute("aria-pressed", state.answers[q.id] === o.v ? "true" : "false");
    b.appendChild(el("span", "dot"));
    b.appendChild(el("span", null, o.t));
    b.addEventListener("click", function () {
      state.answers[q.id] = o.v;
      if (q.id === "idade" && o.v === "menos2") { renderResult(); return; }
      if (state.step < QUESTIONS.length - 1) { state.step++; renderQuestion(); }
      else renderResult();
    });
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if (state.step > 0) {
    var nav = el("div", "nav");
    var back = el("button", "link", "Voltar à pergunta anterior");
    back.type = "button"; back.id = "voltar";
    back.addEventListener("click", function () { state.step--; renderQuestion(); });
    nav.appendChild(back);
    card.appendChild(nav);
  }
  stage.appendChild(card);
}

function restart() { state = { step: 0, answers: {} }; renderQuestion(); window.scrollTo(0, 0); }

function resultText(r) {
  var m = METHODS[r.main], lines = [];
  if (r.extra) lines.push("Resultado: técnica combinada. " + m.name + " (principal) com " + METHODS[r.extra].name + " (complemento).");
  else lines.push("Resultado: método isolado. " + m.name + ".");
  lines.push(m.what);
  if (r.extra) lines.push("Como combinar: " + COMBOS[[r.main, r.extra].sort().join("")]);
  if (r.clock) lines.push("Acrescente o relógio de sono para a madrugada e o acordar cedo.");
  lines.push("Para começar: " + m.steps.join(" "));
  return lines.join("\n\n");
}

function renderResult() {
  progress.hidden = true;
  stage.innerHTML = "";
  var r = diagnose(state.answers);
  var card = el("section", "card");

  if (r.tooYoung) {
    card.appendChild(el("span", "badge", "Ainda não é a hora"));
    card.appendChild(moonArt());
    card.appendChild(el("h2", "result-name", "Este teste é para crianças a partir de 2 anos"));
    card.appendChild(el("p", null, "Os três métodos do protocolo dependem de a criança entender combinados simples, o que acontece a partir dos 2 anos. Antes disso, converse com o pediatra sobre o sono do seu filho e cuide da rotina, dos horários e do ambiente, que já fazem muita diferença."));
    var navY = el("div", "nav");
    var againY = el("button", "btn ghost", "Refazer o teste"); againY.type = "button"; againY.id = "refazer";
    againY.addEventListener("click", restart);
    navY.appendChild(againY); card.appendChild(navY);
    stage.appendChild(card);
    return;
  }

  var m = METHODS[r.main];
  card.appendChild(el("span", "badge", r.extra ? "Técnica combinada" : "Método isolado"));
  card.appendChild(el("h2", "result-name", r.extra ? m.name + " com " + METHODS[r.extra].name.replace(/^A /, "a ") : m.name));
  card.appendChild(heroArt(r.main));
  card.appendChild(el("p", null, m.what));
  card.appendChild(el("p", null, m.why));

  if (r.note) {
    var nb = el("div", "block");
    nb.appendChild(el("h3", null, "Um ajuste pela idade"));
    nb.appendChild(el("p", null, r.note));
    card.appendChild(nb);
  }

  if (r.extra) {
    var cb = el("div", "block");
    cb.appendChild(el("h3", null, "Como combinar os dois"));
    cb.appendChild(heroArt("COMBO", true));
    cb.appendChild(el("p", null, "O método principal é " + m.name.replace(/^A /, "a ") + ", e " + METHODS[r.extra].name.replace(/^A /, "a ") + " entra como complemento."));
    cb.appendChild(el("p", null, COMBOS[[r.main, r.extra].sort().join("")]));
    card.appendChild(cb);
  }

  if (r.parentsBed) {
    var pb = el("div", "block");
    pb.appendChild(el("h3", null, "Antes de tudo, a cama dele"));
    pb.appendChild(el("p", null, "Hoje ele adormece na cama ou no quarto de vocês, então o primeiro passo é ele passar a adormecer na cama dele, com você por perto. Faça essa mudança na primeira noite e, a partir dela, siga as etapas do método."));
    card.appendChild(pb);
  }

  var sb = el("div", "block");
  sb.appendChild(el("h3", null, "Para começar"));
  var ol = el("ol", "steps");
  m.steps.forEach(function (s) { ol.appendChild(el("li", null, s)); });
  sb.appendChild(ol);
  card.appendChild(sb);

  if (r.clock) {
    var kb = el("div", "block");
    kb.appendChild(el("h3", null, "Acrescente o relógio de sono"));
    var row = el("div", "clock");
    var lights = el("div", "lights"); lights.setAttribute("aria-hidden", "true");
    lights.appendChild(el("span", "r")); lights.appendChild(el("span", "g"));
    row.appendChild(lights);
    var txt = el("div");
    txt.appendChild(el("p", null, "Ele fica vermelho durante a noite e verde a partir do horário em que a criança pode sair do quarto. Ajuda nos despertares da madrugada e no acordar cedo demais, junto com o método acima."));
    if (r.clockYoung) txt.appendChild(el("p", "small", "Vale a partir de 2 anos e meio, quando a criança já reconhece as cores e entende uma regra simples."));
    row.appendChild(txt);
    kb.appendChild(row);
    card.appendChild(kb);
  }

  if (r.older && (r.main === "B" || r.extra === "B")) {
    var ob = el("div", "block");
    ob.appendChild(el("p", "small", "Aos 6 anos ou mais, o “Com licença, já volto” costuma funcionar muito bem, porque a criança já entende o combinado e consegue ficar tranquila no quarto esperando você voltar."));
    card.appendChild(ob);
  }

  var tb = el("div", "block");
  tb.appendChild(el("h3", null, "Suas respostas"));
  var tally = el("div", "tally");
  ["A", "B", "C"].forEach(function (k) {
    var rw = el("div", "tally-row");
    rw.appendChild(el("span", null, METHODS[k].name));
    var bar = el("div", "bar"); var fill = document.createElement("i");
    fill.style.width = (r.counts[k] / r.total * 100) + "%"; bar.appendChild(fill);
    rw.appendChild(bar);
    rw.appendChild(el("b", null, r.counts[k] + " de " + r.total));
    tally.appendChild(rw);
  });
  tb.appendChild(tally);
  card.appendChild(tb);

  card.appendChild(helpBlock());

  var fb = el("div", "block");
  fb.appendChild(el("p", "small", "O passo a passo completo, as adaptações e os sinais de progresso estão no Protocolo Sono sem Drama. Este teste é um guia prático e não substitui a avaliação do pediatra. Observe seu filho nas primeiras noites e, se depois de uma semana outro caminho combinar mais, ajuste uma única vez e siga firme."));
  fb.appendChild(el("p", "small", "© 2026 Lourdes Corsi. Todos os direitos reservados. Este material não pode ser reproduzido, copiado ou distribuído, no todo ou em partes, sem autorização por escrito da autora."));
  var nav = el("div", "nav");
  var copy = el("button", "btn", "Copiar meu resultado"); copy.type = "button"; copy.id = "copiar";
  var again = el("button", "btn ghost", "Refazer o teste"); again.type = "button"; again.id = "refazer";
  var status = el("div", "copied"); status.setAttribute("aria-live", "polite");
  copy.addEventListener("click", function () {
    var text = resultText(r);
    var fallback = function () {
      var ta = document.getElementById("resultado-texto");
      if (!ta) { ta = el("textarea", "fallback"); ta.id = "resultado-texto"; ta.readOnly = true; fb.appendChild(ta); }
      ta.value = text; ta.focus(); ta.select();
      status.textContent = "Selecione o texto abaixo e copie.";
    };
    try {
      navigator.clipboard.writeText(text).then(function () { status.textContent = "Resultado copiado."; }, fallback);
    } catch (e) { fallback(); }
  });
  again.addEventListener("click", restart);
  nav.appendChild(copy); nav.appendChild(again);
  fb.appendChild(nav); fb.appendChild(status);
  card.appendChild(fb);

  stage.appendChild(card);
  window.scrollTo(0, 0);
}

function start(saved) {
  if (saved && saved.answers) state = saved;
  if (state.done) renderResult(); else renderQuestion();
}
if (typeof window !== "undefined") {
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return state; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}
</script>
